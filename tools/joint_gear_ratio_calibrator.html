<!DOCTYPE html>
<html lang=zh-CN><head>
<meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1>
<title>关节减速比校正</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{color-scheme:dark;--page:#0f172a;--card:#1e293b;--field:#111827;--line:#334155;--muted:#94a3b8;--dim:#64748b;--text:#e2e8f0;--accent:#8b5cf6;--green:#34d399}
body{min-height:100vh;padding:32px 16px 48px;background:radial-gradient(circle at 50% -180px,rgba(139,92,246,.16),transparent 420px),var(--page);color:var(--text);font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif}
.container{width:min(100%,680px);margin:auto}.back{display:inline-block;margin-bottom:24px;color:var(--muted);font-size:.82rem;text-decoration:none}.back:hover{color:#c4b5fd}
.eyebrow{margin-bottom:8px;color:#a78bfa;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
h1{color:#f8fafc;font-size:clamp(1.6rem,5vw,2rem);letter-spacing:-.02em}.subtitle{margin:10px 0 28px;color:var(--muted);font-size:.9rem;line-height:1.7}
.card{margin-bottom:18px;padding:24px;border:1px solid var(--line);border-radius:14px;background:rgba(30,41,59,.94);box-shadow:0 20px 48px rgba(2,6,23,.18)}
h2{margin-bottom:18px;color:var(--dim);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:7px;color:var(--muted);font-size:.82rem;font-weight:600}.input{position:relative}.input input{padding-right:52px}.input span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:.75rem}
input{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;outline:0;background:var(--field);color:#f1f5f9;font:inherit}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.14)}small{color:var(--dim);font-size:.72rem;font-weight:400;line-height:1.5}
.actions{display:flex;gap:10px;margin-top:22px}button{min-height:42px;padding:9px 18px;border:0;border-radius:9px;background:var(--accent);color:white;font:inherit;font-size:.84rem;font-weight:700;cursor:pointer}button:hover{background:#7c3aed}.actions button:first-child{flex:1}.secondary{border:1px solid var(--line);background:var(--field);color:var(--muted)}
#error{display:none;margin-top:14px;padding:10px 12px;border:1px solid rgba(248,113,113,.32);border-radius:8px;background:rgba(127,29,29,.16);color:#fca5a5;font-size:.8rem}#error.visible{display:block}
.result{position:relative;overflow:hidden;border-color:rgba(139,92,246,.48)}.result:before{position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--accent),#3b82f6);content:''}.result p{color:var(--muted);font-size:.8rem}.main-result{display:flex;align-items:baseline;gap:8px;margin:7px 0 20px}.main-result output{color:var(--green);font:700 clamp(2rem,9vw,2.8rem) Consolas,monospace;letter-spacing:-.04em}.main-result span{color:var(--dim)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics>div{display:flex;flex-direction:column;gap:5px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--field)}.metrics b{font:400 .9rem Consolas,monospace}
.formula{padding:15px 16px;border:1px solid #312e81;border-radius:9px;background:#11152b;color:#c4b5fd;font:400 .82rem/1.8 Consolas,monospace}.note{margin-top:12px;color:var(--dim);font-size:.76rem;line-height:1.65}
@media(max-width:540px){body{padding-top:22px}.card{padding:20px}.grid,.metrics{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body><main class=container>
<a class=back href=../index.html>← 返回工具箱</a>
<div class=eyebrow>Robot Joint Calibration</div><h1>关节减速比校正</h1>
<p class=subtitle>用关节实际转过的角度修正运控系统中的减速比参数。建议使用较大的转动角度并重复测量，以降低读数误差。</p>
<section class=card><h2>测量数据</h2><div class=grid>
<label class=full>当前减速比<div class=input><input id=ratio type=number value=100 min=0 step=any><span>: 1</span></div><small>运控系统当前配置的关节减速比</small></label>
<label>运控反馈角度<div class=input><input id=feedback type=number value=90 step=any><span>deg</span></div><small>控制器反馈的关节转角</small></label>
<label>实测角度<div class=input><input id=measured type=number value=89.5 step=any><span>deg</span></div><small>量具测得的关节实际转角</small></label>
</div><div class=actions><button id=calculate>计算校准值</button><button class=secondary id=reset>重置</button></div><div id=error role=alert></div></section>
<section class='card result' aria-live=polite>
<h2>校准结果</h2><p>校准后减速比</p>
<div class=main-result><output id=result>100.558659</output><span>: 1</span></div>
<div class=metrics><div><small>角度误差（实测 − 反馈）</small><b id=angle-error>−0.500000 deg</b></div>
<div><small>减速比修正量</small><b id=ratio-change>+0.558659%</b></div></div></section>
<section class=card><h2>计算说明</h2>
<div class=formula>校准后减速比 = 当前减速比 × 运控反馈角度 ÷ 实测角度</div>
<p class=note>反馈角度与实测角度应采用同一方向、同一单位。若两者符号相反，请先检查关节方向配置；实测角度不能为 0。</p></section>
</main><script>
const inputs={ratio:document.getElementById('ratio'),feedback:document.getElementById('feedback'),measured:document.getElementById('measured')};
const result=document.getElementById('result'),angleError=document.getElementById('angle-error'),ratioChange=document.getElementById('ratio-change'),error=document.getElementById('error');
const fmt=value=>value.toLocaleString('zh-CN',{useGrouping:false,minimumFractionDigits:6,maximumFractionDigits:6});
const signed=(value,unit)=>(value>0?'+':value<0?'−':'')+fmt(Math.abs(value))+unit;
function fail(message){error.textContent=message;error.classList.add('visible')}
function calculate(){
 const current=Number(inputs.ratio.value),feedback=Number(inputs.feedback.value),measured=Number(inputs.measured.value);
 if(![current,feedback,measured].every(Number.isFinite)){fail('请完整输入三个有效数值。');return}
 if(current<=0){fail('当前减速比必须大于 0。');return}
 if(feedback===0||measured===0){fail('反馈角度和实测角度都不能为 0。');return}
 if(Math.sign(feedback)!==Math.sign(measured)){fail('反馈角度与实测角度方向不一致，请检查角度符号或关节方向配置。');return}
 const calibrated=current*feedback/measured;
 if(!Number.isFinite(calibrated)||calibrated<=0){fail('当前数据无法得到有效的减速比，请检查输入。');return}
 error.textContent='';error.classList.remove('visible');result.textContent=fmt(calibrated);
 angleError.textContent=signed(measured-feedback,' deg');ratioChange.textContent=signed((calibrated/current-1)*100,'%');
}
document.getElementById('calculate').addEventListener('click',calculate);
document.getElementById('reset').addEventListener('click',()=>{inputs.ratio.value=100;inputs.feedback.value=90;inputs.measured.value=89.5;calculate();inputs.ratio.focus()});
Object.values(inputs).forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter')calculate()}));
calculate();</script></body></html>
